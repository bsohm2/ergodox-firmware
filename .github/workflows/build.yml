name: Build ErgoDox Infinity

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'keymap/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 python3-pip libhidapi-dev dfu-util

      - name: Clone QMK master (includes PR 25963 kiibohd mcu_reset fix)
        run: git clone --depth 1 https://github.com/qmk/qmk_firmware.git

      - name: Initialize QMK submodules
        working-directory: qmk_firmware
        run: git submodule update --init --recursive

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user qmk
          python3 -m pip install --user -r qmk_firmware/requirements.txt

      - name: Copy keymap
        run: cp -r keymap/default qmk_firmware/keyboards/input_club/ergodox_infinity/keymaps/brandon

      - name: Build firmware
        working-directory: qmk_firmware
        run: make input_club/ergodox_infinity:brandon

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ergodox-infinity-brandon
          path: qmk_firmware/*.bin

      - name: Generate keymap diagram
        continue-on-error: true
        working-directory: qmk_firmware
        run: |
          python3 -m pip install --user keymap-drawer
          qmk c2json -kb input_club/ergodox_infinity -km brandon -o ../keymap.json
          keymap parse -q ../keymap.json > ../keymap.yaml
          keymap draw ../keymap.yaml > ../keymap.svg

      - name: Upload keymap diagram
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: keymap-diagram
          path: keymap.svg
