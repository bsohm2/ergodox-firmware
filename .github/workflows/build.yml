name: Build Ergodox Infinity
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout QMK 0.14.0
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: '0.14.0'
          submodules: false
          path: qmk_firmware

      - name: Init required submodules
        working-directory: qmk_firmware
        run: git submodule update --init lib/chibios lib/chibios-contrib lib/printf lib/lufa

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc git unzip wget \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libhidapi-hidraw0 libusb-dev python3-pip

      - name: Install Python dependencies
        working-directory: qmk_firmware
        run: python3 -m pip install --user -r requirements.txt

      - name: Copy keymap
        run: cp -r keymap qmk_firmware/keyboards/ergodox_infinity/keymaps/brandon

      - name: Build firmware
        working-directory: qmk_firmware
        run: make ergodox_infinity:brandon

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ergodox-infinity-brandon
          path: qmk_firmware/*.bin
