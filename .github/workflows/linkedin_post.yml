name: LinkedIn Post Generator

on:
  schedule:
    # Every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: {}  # allows manual trigger from GitHub Actions tab

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run LinkedIn post generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LI_EMAIL_SENDER: ${{ secrets.LI_EMAIL_SENDER }}
          LI_EMAIL_PASSWORD: ${{ secrets.LI_EMAIL_PASSWORD }}
          LI_EMAIL_RECIPIENT: ${{ secrets.LI_EMAIL_RECIPIENT }}
        run: python linkedin_post_generator.py
